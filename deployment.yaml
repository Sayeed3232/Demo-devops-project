apiVersion: apps/v1
kind: Deployment
metadata:
 name: python-app-deployment
 namespace: default
 labels:
   app: python-app
spec:
 replicas: 2
 selector:
   matchLabels:
     app: python-app
 template:
   metadata:
     labels:
       app: python-app
   spec:
     containers:
     - name: python-app
       # Replace <ACCOUNT_ID> and <AWS_REGION> with your actual AWS Account ID & Region
       image: <ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/python-eks-demo:latest
       imagePullPolicy: Always
       ports:
       - containerPort: 5000
       resources:
         requests:
           cpu: 100m
           memory: 128Mi
         limits:
           cpu: 250m
           memory: 256Mi
       livenessProbe:
         httpGet:
           path: /health
           port: 5000
         initialDelaySeconds: 10
         periodSeconds: 10
       readinessProbe:
         httpGet:
           path: /health
           port: 5000
         initialDelaySeconds: 5
         periodSeconds: 5
